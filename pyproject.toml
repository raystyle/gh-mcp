[project]
name = "gh-mcp"
version = "0.1.0"
description = "Read-only MCP server (stdio) that searches public GitHub repositories and code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "raystyle" }]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "mcp-types>=2.3.0",
]

[project.scripts]
gh-mcp = "gh_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gh_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
